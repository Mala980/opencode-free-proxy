name: check-test

# Adapted to the v2.2.0 upstream workflow: keep the unit-test job isolated,
# but run this Node-only service on its supported Node versions plus Node 24
# on Linux and Windows. The repo has no Bun/Turbo packages or browser suite.

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref) }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unit:
    name: unit (node ${{ matrix.node }} / ${{ matrix.os }})
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: "18"
            os: ubuntu-latest
          - node: "20"
            os: ubuntu-latest
          - node: "22"
            os: ubuntu-latest
          - node: "24"
            os: ubuntu-latest
          - node: "24"
            os: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install
        run: npm ci

      - name: Test
        run: npm test
